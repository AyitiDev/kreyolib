[project]
name = "kreyolib"
version = "0.1.0"
description = "A software library for Haitian Creole (Kreyòl Ayisyen) natural language processing, text normalization, and localization. --- Yon bibliyotèk lojisyèl pou tretman lang natirèl, nòmalizasyon tèks, ak lokalizasyon an Kreyòl Ayisyen."
authors = [
  { name = "AyitiDev", email = "116703678+speedyk-005@users.noreply.github.com" }
]

license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10"

classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed"
]

keywords = [
  "haitian-creole", "kreyol", "nlp", "natural-language-processing",
  "text-processing", "tokenization", "pos-tagging", "linguistics",
  "haiti", "ayiti", "open-source"
]

dependencies = [
  "regex>=2024.11.6",
  "ftfy>=6.2.0,<7.0",
  "nltk>=3.9,<4.0",
  "joblib>=1.3.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.5",
  "pytest-cov>=6.2.1",
  "pre-commit>=4.4.0",
  "pydoc-markdown>=4.8.0,<5.0",
  "ruff>=0.14.14",
]

[project.urls]
Homepage = "https://github.com/AyitiDev/kreyolib"
Repository = "https://github.com/AyitiDev/kreyolib"
Issues = "https://github.com/AyitiDev/kreyolib/issues"
Changelog = "https://github.com/AyitiDev/kreyolib/blob/main/CHANGELOG.md"

[build-system]
requires = [
    "setuptools>=64",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["kreyolib"]
include-package-data = true

[tool.pytest.ini_options]
minversion = "7.4"
addopts = "--cov=kreyolib --cov-report=term-missing:skip-covered --durations=10"
testpaths = ["tests"]
python_files = "test_*.py"

[tool.coverage.run]
omit = ["*/cli.py"]

[tool.ruff]
target-version = "py310"
line-length = 95

[tool.ruff.lint]
select = [
    "A",      # Built-in shadowing and variable shadowing checks
    "ARG",    # Unused function and method arguments
    "B",      # Likely bugs and dangerous patterns (flake8-bugbear)
    "BLE",    # Blind exception handling (e.g. bare except)
    "C90",    # McCabe complexity checks
    "E",      # pycodestyle errors (PEP 8 violations)
    "ERA",    # Commented-out dead code detection
    "F",      # Pyflakes logical and static analysis errors
    "FBT",    # Boolean positional argument "traps"
    "FIX",    # TODO, FIXME, XXX comment detection
    "FURB",   # Refactoring and modernization suggestions (refurb)
    "I",      # Import sorting and organization (isort)
    "ICN",    # Import alias naming conventions
    "INP",    # Missing __init__.py package checks
    "N",      # PEP 8 naming conventions (pep8-naming)
    "PERF",   # Performance anti-patterns
    "PGH",    # Pygrep-hooks rules and miscellaneous checks
    "PIE",    # Unnecessary or non-pythonic code patterns
    "PL",     # Pylint-derived checks
    "PT",     # Pytest style and correctness checks
    "PTH",    # Prefer pathlib over os/path utilities
    "Q",      # Quote style consistency
    "RET",    # Return statement consistency and simplification
    "RSE",    # Raise statement improvements
    "RUF",    # Ruff-specific rules
    "S",      # Security issues and insecure code patterns (bandit)
    "SLF",    # Access to private members
    "SIM",    # Code simplification opportunities
    "TC",     # Type-checking block optimizations
    "TCH",    # Move typing-only imports into TYPE_CHECKING blocks
    "TID",    # Import restriction and tidiness rules
    "T10",    # Debugger breakpoint detection
    "UP",     # Python syntax and API modernization (pyupgrade)
    "W",      # pycodestyle warnings
]
ignore = ["PLW2901", "PLW0603", "COM812", "D203", "D213", "RUF001", "RUF003", "RUF012", "S311", "FURB167", "PLC0206", "PLC0415", "PERF203"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F403", "I001"]
"cli.py" = ["PLR0913", "PLR0917", "UP045", "FBT001", "FBT002", "PTH123", "S603"]
"src/kreyolib/tagger/pos.py" = ["PLR2004"]
"tests/*" = ["E501", "S101", "PLR2004", "Q0", "ERA001", "SLF001", "PT006", "ARG002", "S101"]

[tool.ruff.format]
exclude = [".git", ".venv", "build", "dist"]
